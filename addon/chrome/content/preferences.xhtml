<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>

  <!-- __buildVersion__ is substituted from package.json at build time, so the
       pane can never drift from the installed version. -->
  <description class="ac-pref-version">Version __buildVersion__</description>

  <hbox align="center">
    <html:label
      for="annotationcompositor-pref-tagPrefix"
      data-l10n-id="pref-tag-prefix-label"
    ></html:label>
    <html:input
      type="text"
      id="annotationcompositor-pref-tagPrefix"
      preference="__prefsPrefix__.tagPrefix"
    ></html:input>
  </hbox>

  <hbox align="center">
    <html:label
      for="annotationcompositor-pref-tagType"
      data-l10n-id="pref-tag-type-label"
    ></html:label>
    <menulist id="annotationcompositor-pref-tagType" preference="__prefsPrefix__.tagType">
      <menupopup>
        <menuitem value="0" data-l10n-id="pref-tag-type-manual"></menuitem>
        <menuitem value="1" data-l10n-id="pref-tag-type-automatic"></menuitem>
      </menupopup>
    </menulist>
  </hbox>
  <description data-l10n-id="pref-tag-type-description"></description>

  <separator class="thin"></separator>

  <checkbox
    id="annotationcompositor-pref-navigateOnClick"
    preference="__prefsPrefix__.navigateOnClick"
    data-l10n-id="pref-navigate-on-click"
  />
  <checkbox
    id="annotationcompositor-pref-arrowKeysScroll"
    preference="__prefsPrefix__.arrowKeysScroll"
    data-l10n-id="pref-arrow-keys-scroll"
  />
  <checkbox
    id="annotationcompositor-pref-persistStickyGroup"
    preference="__prefsPrefix__.persistStickyGroup"
    data-l10n-id="pref-persist-sticky-group"
  />
  <checkbox
    id="annotationcompositor-pref-includeSubfolders"
    preference="__prefsPrefix__.includeSubfolders"
    data-l10n-id="pref-include-subfolders"
  />
  <checkbox
    id="annotationcompositor-pref-includeUngrouped"
    preference="__prefsPrefix__.includeUngrouped"
    data-l10n-id="pref-include-ungrouped"
  />
  <checkbox
    id="annotationcompositor-pref-stickyOnCreate"
    preference="__prefsPrefix__.stickyOnCreate"
    data-l10n-id="pref-sticky-on-create"
  />
  <checkbox
    id="annotationcompositor-pref-pinGroupsPanel"
    preference="__prefsPrefix__.pinGroupsPanel"
    data-l10n-id="pref-pin-groups-panel"
  />
  <description data-l10n-id="pref-pin-groups-panel-description"></description>

  <separator class="thin"></separator>

  <checkbox
    id="annotationcompositor-pref-syncSettings"
    preference="__prefsPrefix__.syncSettings"
    data-l10n-id="pref-sync-settings"
  />
  <description data-l10n-id="pref-sync-settings-description"></description>

  <separator class="thin"></separator>

  <!-- Moved here from the Groups panel toolbar. Acts on the item current in the
       main window (the open PDF's item, else the selected library item). -->
  <hbox align="center">
    <button
      id="annotationcompositor-pref-restoreGrouping"
      data-l10n-id="pref-restore-grouping"
      oncommand="Zotero.__addonInstance__.hooks.onRestoreFromPrefs()"
    />
  </hbox>
  <description data-l10n-id="pref-restore-grouping-description"></description>

  <separator class="thin"></separator>

  <checkbox
    id="annotationcompositor-pref-useCustomSelectionColor"
    preference="__prefsPrefix__.useCustomSelectionColor"
    data-l10n-id="pref-use-custom-selection-color"
  />
  <hbox align="center">
    <html:label
      for="annotationcompositor-pref-selectionColor"
      data-l10n-id="pref-selection-color-label"
    ></html:label>
    <html:input
      type="color"
      id="annotationcompositor-pref-selectionColor"
      preference="__prefsPrefix__.selectionColor"
    ></html:input>
  </hbox>

  <separator class="thin"></separator>

  <hbox align="center">
    <html:label
      for="annotationcompositor-pref-templateId"
      data-l10n-id="pref-template-label"
    ></html:label>
    <menulist
      id="annotationcompositor-pref-templateId"
      preference="__prefsPrefix__.templateId"
    >
      <menupopup>
        <menuitem value="markdown" data-l10n-id="pref-template-markdown"></menuitem>
        <menuitem
          value="markdown-labels"
          data-l10n-id="pref-template-markdown-labels"
        ></menuitem>
        <menuitem value="html" data-l10n-id="pref-template-html"></menuitem>
        <menuitem value="tex" data-l10n-id="pref-template-tex"></menuitem>
        <menuitem value="tex-labels" data-l10n-id="pref-template-tex-labels"></menuitem>
      </menupopup>
    </menulist>
  </hbox>

  <hbox align="center">
    <html:label
      for="annotationcompositor-pref-entryFormat"
      data-l10n-id="pref-entry-format-label"
    ></html:label>
    <html:input
      type="text"
      id="annotationcompositor-pref-entryFormat"
      style="flex: 1; min-width: 20em"
      preference="__prefsPrefix__.entryFormat"
    ></html:input>
  </hbox>
  <description data-l10n-id="pref-entry-format-description"></description>

  <hbox align="center">
    <html:label
      for="annotationcompositor-pref-labelFilterMode"
      data-l10n-id="pref-label-filter-mode-label"
    ></html:label>
    <menulist
      id="annotationcompositor-pref-labelFilterMode"
      preference="__prefsPrefix__.labelFilterMode"
    >
      <menupopup>
        <menuitem value="off" data-l10n-id="pref-label-filter-off"></menuitem>
        <menuitem value="include" data-l10n-id="pref-label-filter-include"></menuitem>
        <menuitem value="exclude" data-l10n-id="pref-label-filter-exclude"></menuitem>
      </menupopup>
    </menulist>
    <html:input
      type="text"
      id="annotationcompositor-pref-labelFilter"
      style="flex: 1; min-width: 20em"
      preference="__prefsPrefix__.labelFilter"
    ></html:input>
  </hbox>
  <description data-l10n-id="pref-label-filter-description"></description>

  <separator class="thin"></separator>

  <checkbox
    id="annotationcompositor-pref-texPageBreak"
    preference="__prefsPrefix__.texPageBreak"
    data-l10n-id="pref-tex-page-break"
  />
  <html:label
    for="annotationcompositor-pref-texPreamble"
    data-l10n-id="pref-tex-preamble-label"
  ></html:label>
  <html:textarea
    id="annotationcompositor-pref-texPreamble"
    style="width: 100%; box-sizing: border-box; font-family: monospace"
    rows="12"
    spellcheck="false"
    preference="__prefsPrefix__.texPreamble"
  ></html:textarea>
  <description data-l10n-id="pref-tex-preamble-description"></description>
</groupbox>
